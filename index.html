<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer</title>
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="hljs-github.min.css" id="hljsTheme">
<style>
.raw { background: var(--bs-tertiary-bg); color: var(--bs-body-color); font-family: monospace; font-size: 1em; white-space: pre-wrap; }
.split-container { display: flex; height: calc(100vh - 56px); }
.pane { overflow-y: auto; padding: 20px; font-size: 16px; }
.left { flex: 1; min-width: 100px; }
.right { flex: 1; min-width: 100px; }
.divider { width: 6px; background: var(--bs-border-color); cursor: col-resize; flex-shrink: 0; }
.divider:hover { background: #0d6efd; }
#renderedContent pre { background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color); border-radius: 6px; padding: 1em; overflow-x: auto; }
#renderedContent pre code { background: none; padding: 0; }
#renderedContent code { background: var(--bs-tertiary-bg); padding: 0.2em 0.4em; border-radius: 3px; }
#renderedContent table td { white-space: pre-line; }
</style>
<script src="marked.min.js" defer></script>
<script src="highlight.min.js" defer></script>
<script src="mermaid.min.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
<span class="navbar-brand mb-0 h6" id="title">Markdown Viewer</span>
<span class="d-flex align-items-center gap-2">
<label class="text-light small mb-0">Theme</label>
<select id="themeToggle" class="form-select form-select-sm bg-secondary text-light border-0" style="width:auto">
<option value="light">Light</option>
<option value="dark">Dark</option>
</select>
<label class="text-light small mb-0">File</label>
<select id="fileSelect" class="form-select form-select-sm bg-secondary text-light border-0" style="width:auto">
<option>Loading files...</option>
</select>
<label class="text-light small mb-0">Reload</label>
<select id="interval" class="form-select form-select-sm bg-secondary text-light border-0" style="width:auto">
<option value="5000">5s</option>
<option value="10000" selected>10s</option>
<option value="30000">30s</option>
<option value="60000">60s</option>
</select>
<span class="text-light small" id="status">Loading...</span>
</span>
</nav>
<div class="split-container">
<div class="pane left raw" id="leftPane">
<div class="d-flex justify-content-between align-items-center">
<h6 class="text-secondary text-uppercase mb-0" style="font-size:1em">Raw Markdown</h6>
<button class="btn btn-sm btn-outline-secondary" id="copyRaw">Copy</button>
</div>
<pre id="rawContent"></pre>
</div>
<div class="divider" id="divider"></div>
<div class="pane right" id="rightPane">
<div class="d-flex justify-content-between align-items-center">
<h6 class="text-secondary text-uppercase mb-0" style="font-size:1em">Rendered</h6>
<button class="btn btn-sm btn-outline-secondary" id="copyRendered">Copy</button>
</div>
<div id="renderedContent"></div>
</div>
</div>
</body>
</html>
